name: VPS Pinger

on:
  workflow_dispatch:

concurrency:
  group: pinger
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Jeda acak
        run: sleep $((RANDOM % 30 + 1))

      - name: SSH ping (dengan retry)
        env:
          TARGET: ${{ secrets.INSTABOX_SSH_TARGET }}
        run: |
          for i in 1 2 3; do
            if ssh -p 2222 \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes \
              -o ConnectTimeout=60 \
              "$TARGET" "uptime && sleep $((RANDOM % 8 + 3))"; then
              exit 0
            fi
            echo "Percobaan $i gagal, ulangi..."
            sleep 15
          done
          exit 1
